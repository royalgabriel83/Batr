name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the full git history; any detected secret fails the job.
      - name: gitleaks
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  checks:
    name: Lint, type check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Database and API tests (local Supabase)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      # Applies every migration from scratch.
      - run: pnpm db:reset
      - run: pnpm test:db
      # Offer API route handlers against the same local Supabase.
      - run: pnpm test:api
      - if: always()
        run: pnpm db:stop

  e2e:
    name: Browser tests (Chromium and WebKit)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @batr/web exec playwright install --with-deps chromium webkit
      # Auth journeys run against a real local Supabase (sign-up emails go
      # to its local inbox). env:local writes apps/web/.env.local from it;
      # the file exists only inside this job and is never committed.
      - run: pnpm db:start
      - run: pnpm env:local
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm test:e2e
      - if: always()
        run: pnpm db:stop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
