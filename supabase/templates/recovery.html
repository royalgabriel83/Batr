<h2>Reset your password</h2>
<p>We received a request to reset the password for your BATR account.</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p>This link works once and expires in 1 hour. If you did not ask to reset your password, you can ignore this email; your password stays the same.</p>
